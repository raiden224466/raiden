        }  
        .btn {  
            display: block;  
            background: linear-gradient(45deg, #0088cc, #00a8ff);  
            color: white;  
            text-decoration: none;  
            padding: 15px 30px;  
            border-radius: 50px;  
            font-size: 18px;  
            font-weight: bold;  
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.4);  
            transition: all 0.3s ease;  
        }  
        .btn:hover {  
            transform: translateY(-3px);  
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.6);  
        }  
        .footer-text {  
            margin-top: 25px;  
            font-size: 12px;  
            color: #78909c;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); }  
            50% { transform: scale(1.05); }  
            100% { transform: scale(1); }  
        }
